name: Bug report
description: Report a reproducible defect in the generic package.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or vulnerability details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include bounded code, capability contracts, and steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: R, operating system, Shiny, and browser versions.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains no credentials, secrets, or private datasets.
          required: true
